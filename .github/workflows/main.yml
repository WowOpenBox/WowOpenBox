# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  push:
    tags:
      - 'v*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout tools repo
        uses: actions/checkout@v4
        with:
          repository: WowOpenBox/BuildKit
          path: buildkit

      - name: Get and set the version
        id: get_version
        run: |
          VERSION=${GITHUB_REF/refs\/tags\//}
          if [[ "${VERSION}" == "refs/heads/main" ]]; then
            VERSION=dev-pre
          fi
          echo ::set-output name=VERSION::${VERSION}
          echo "Version=\"$VERSION\""
          if [ -z "${VERSION##*pre*}" ]; then
            echo ::set-output name=PRERELEASE::true
          else
            echo ::set-output name=PRERELEASE::false
          fi
          sed -e "s/^set vers .*$/set vers \"$VERSION\"/" < WowOpenBox.tcl > WowOpenBox.tkapp
          # This will only work for X.Y.Z so can't get past .9 on Z for instance
          # sed -b -e "s/OpenMultiBoxing-vX.Y.Z.exe/OpenMultiBoxing-$VERSION.exe/" buildkit/OpenMultiBoxing_RR.exe > buildkit/OpenMultiBoxing_RR-$VERSION.exe
        shell: bash
      - name: Make the executable and zip
        run: |
          cd buildkit
          cp ..\WowOpenBox.tkapp OpenMultiBoxing.vfs\app
          .\build.ps1 -Out WOB2027-${{ steps.get_version.outputs.VERSION }}.exe -Version ${{ steps.get_version.outputs.VERSION }}
          Compress-Archive -Path WOB2027-${{ steps.get_version.outputs.VERSION }}.exe,..\README.txt,..\launchwow.bat,..\launchwowc.bat -DestinationPath WOB2027-${{ steps.get_version.outputs.VERSION }}.zip
      # before any release is made: the tests with the new exe
      - name: Tests
        run: OMB_EXE=buildkit/WOB2027-${{ steps.get_version.outputs.VERSION }}.exe bash tests/run.sh
        shell: bash
      - name: Make the Microsoft Store package
        run: |
          msix\pack.ps1 -Exe buildkit\WOB2027-${{ steps.get_version.outputs.VERSION }}.exe -Version ${{ steps.get_version.outputs.VERSION }} -Out WowOpenBox-${{ steps.get_version.outputs.VERSION }}.msix
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: WOB2027 ${{ steps.get_version.outputs.VERSION }}
          draft: true
          prerelease: ${{ steps.get_version.outputs.PRERELEASE }}

      - name: Upload Zip
        id: upload-release-asset1
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: .\buildkit\WOB2027-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: WOB2027-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip

      - name: Upload Update Code
        id: upload-release-asset2
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: WowOpenBox.tkapp
          asset_name: WowOpenBox-${{ steps.get_version.outputs.VERSION }}.tkapp
          asset_content_type: application/octet-stream

      # Not a release asset (users get it from the Store): in the run's artifacts, for manual submissions.
      # The Store submission is done when the release is published, with its notes (store.yml)
      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: WowOpenBox-${{ steps.get_version.outputs.VERSION }}.msix
          path: WowOpenBox-${{ steps.get_version.outputs.VERSION }}.msix
